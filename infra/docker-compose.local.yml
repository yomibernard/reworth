# Standalone local stack with remapped host ports (avoids medimind/etc conflicts).
# docker compose -f infra/docker-compose.local.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: reworth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reworth
      POSTGRES_PASSWORD: reworth
      POSTGRES_DB: reworth
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reworth -d reworth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: reworth-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: reworth-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reworth
      MINIO_ROOT_PASSWORD: reworthsecret
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: reworth-mailhog
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
