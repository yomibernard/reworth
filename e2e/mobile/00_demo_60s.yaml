# ReWorth Maestro — ≤60s demo smoke (device/sim)
# Goal: Home → PDP sticky actions → Chats under one minute.
# Preconditions: seed running, API :3001, Expo Metro, preferably signed-in.
# Record: maestro test e2e/mobile/00_demo_60s.yaml  (then screenrecord separately)
appId: ng.reworth.mobile
---
- launchApp
- assertVisible: "ReWorth"
- tapOn:
    text: "Home"
    optional: true
- assertVisible:
    text: "Sell|SELL|Discover"
    optional: true
# Open first priced listing card if present
- tapOn:
    text: ".*₦.*"
    index: 0
    optional: true
- assertVisible:
    text: "Make offer|Chat|Save|Buy"
    optional: true
- tapOn:
    text: "Make offer"
    optional: true
- tapOn:
    text: "Close|Cancel|Back"
    optional: true
- tapOn:
    text: "Chats"
    optional: true
- assertVisible:
    text: "Chats|No messages|Messages"
    optional: true
