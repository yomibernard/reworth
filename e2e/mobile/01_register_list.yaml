- tapOn:
    id: "phone-input"
- inputText: "+2348010000001"
# OTP mock: use debugCode from API when SMS_PROVIDER=mock, or password login if exposed
- tapOn: "Continue"
# Sell flow
- tapOn: "Sell"
- tapOn: "Add photos"
# … attach fixture image …
- tapOn: "Continue"
- assertVisible: "Title"
- inputText: "Maestro test chair"
- tapOn: "AI assist"
- tapOn: "Publish"
- assertVisible:
    text: "Live|Under review"
    optional: true
