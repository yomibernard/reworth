# ReWorth Maestro — 01 Register / List (stub for device/sim UAT)
# Requires Expo app + Metro; not run in default CI.
# Demo seller (after seed): Ori +2348010000001
# OTP: dual-channel SMS + WhatsApp; mock returns debugCode on POST /auth/otp/request
# Replace OTP_CODE below with debugCode (or live Termii code).
appId: ng.reworth.mobile
---
- launchApp
- assertVisible: "ReWorth"
- tapOn:
    text: "Get started|Continue with phone|Phone"
    optional: true
- tapOn:
    text: "Continue with phone"
    optional: true
- tapOn:
    id: "phone-input"
- eraseText
- inputText: "+2348010000001"
- tapOn:
    id: "send-otp"
- assertVisible:
    text: "SMS|WhatsApp|Enter code"
    optional: true
- tapOn:
    id: "otp-input"
- inputText: "${OTP_CODE}"
- tapOn:
    id: "verify-otp"
# Sell — camera / mock filmstrip
- tapOn:
    text: "SELL|Sell"
- tapOn:
    id: "sell-mock-photos"
- tapOn:
    id: "sell-analyze"
- assertVisible:
    text: "Title|AI draft|Reading"
    optional: true
- tapOn:
    text: "Continue|Publish"
    optional: true
- assertVisible:
    text: "live|Live|Under review|Your item"
    optional: true
